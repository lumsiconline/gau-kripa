name: Deploy GauKripa to GitHub Pages & Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-and-supabase
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://nwvsesrnhuhcihftagcp.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_-tePuMa2rXckjabvey4hWA_dFkB0bJx' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_RAZORPAY_KEY_ID: ${{ vars.VITE_RAZORPAY_KEY_ID }}
        run: npm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-supabase:
    name: Deploy Supabase Migrations & Edge Functions
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Supabase deployment configuration
        id: supabase_check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'nwvsesrnhuhcihftagcp' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping automatic Supabase deploy because SUPABASE_ACCESS_TOKEN secret is not yet configured in GitHub."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.supabase_check.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project and push database migrations
        if: steps.supabase_check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'nwvsesrnhuhcihftagcp' }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase db push --password "$SUPABASE_DB_PASSWORD"
          else
            echo "::notice::SUPABASE_DB_PASSWORD not set; skipping automatic supabase db push (apply SQL via Supabase SQL Editor or set SUPABASE_DB_PASSWORD secret)."
          fi

      - name: Deploy Supabase Edge Functions
        if: steps.supabase_check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'nwvsesrnhuhcihftagcp' }}
        run: |
          supabase functions deploy gaukripa-payments --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy gaukripa-chat --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
